# Based on Midnight Commander 4.8.33 stock associations.
# MC replaces, rather than extends, system associations when this file exists.
# Keep the stock rules so archives and other file types retain their handlers.

[mc.ext.ini]
Version=4.0

[data-parquet]
Regex=[.](parquet|pq|pqt)$
RegexIgnoreCase=true
View=sh "${XDG_CONFIG_HOME:-$HOME/.config}/mc/data.sh" parquet %f

[data-arrow]
Regex=[.](arrow|ipc|feather)$
RegexIgnoreCase=true
View=sh "${XDG_CONFIG_HOME:-$HOME/.config}/mc/data.sh" arrow %f

[data-csv]
Shell=.csv
ShellIgnoreCase=true
Open=sh "${XDG_CONFIG_HOME:-$HOME/.config}/mc/editor.sh" %f
View=sh "${XDG_CONFIG_HOME:-$HOME/.config}/mc/data.sh" csv %f

[data-tsv]
Shell=.tsv
ShellIgnoreCase=true
Open=sh "${XDG_CONFIG_HOME:-$HOME/.config}/mc/editor.sh" %f
View=sh "${XDG_CONFIG_HOME:-$HOME/.config}/mc/data.sh" tsv %f

[terminal-images]
Regex=[.](png|jpe?g|gif|bmp|ico|webp|tiff?|pnm|pbm|pgm|ppm|qoi)$
RegexIgnoreCase=true
Include=image

[text]
# file -z may describe text inside an archive; keep archive and image handlers.
Type=^(?!.*(compressed|archive|image)).*(text|JSON.*data)|^empty$
Open=sh "${XDG_CONFIG_HOME:-$HOME/.config}/mc/editor.sh" %f

[gitfs changeset]
Regex=^\\[git\\]
Open=%cd %p/changesetfs://
View=%cd %p/patchsetfs://

